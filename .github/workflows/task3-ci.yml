name: Task 3 CI

on:
  push:
    branches:
      - week-05-softkleenex
  pull_request:
    branches:
      - week-05-softkleenex

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: task3/backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: task3/backend
        run: .venv/bin/pytest

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: task3/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: task3/frontend
        run: npm ci

      - name: Lint frontend
        working-directory: task3/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: task3/frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: task3/backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: task3/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: task3/frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: task3/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: task3/frontend
        run: npm run test:e2e
